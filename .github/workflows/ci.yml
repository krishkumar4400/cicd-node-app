name: node-app

on:
    workflow_dispatch:
    push:
        paths:
            - "server.js"
            - "package.json"
            - "package-lock.json"
            - "Dockerfile"
            - ".dockerignore"
            - ".github/workflows/**"
        branches:
            - main
            - working

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup NodeJs Runtime Environment
              uses: actions/setup-node@v4
              with:
                  node-version: "22" # Specify your required version (e.g., 18, 20, 22)
                  cache: "npm" # Caches dependencies automatically

            - name: Install Dependencies
              working-directory: .
              run: npm ci

            - name: Run Tests (If Any)
              working-directory: .
              run: npm test --if-present

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build and Push Image to Docker Hub
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ${{secrets.DOCKERHUB_USERNAME}}/node-app:latest
                      ${{secrets.DOCKERHUB_USERNAME}}/node-app:${{github.ref_name}}
                      ${{secrets.DOCKERHUB_USERNAME}}/node-app:${{github.sha}}
